<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まるもちと愉しむラム酒ガイド</title>
  <style>
    :root {
      --primary: #B45309;        /* アンバー（メインカラー） */
      --primary-dark: #78350F;   /* 濃い琥珀色 */
      --primary-light: #F59E0B;  /* 明るい琥珀色 */
      --primary-bg: #FFFBEB;     /* 淡いアンバー背景 */
      --primary-surface: #FEF3C7;/* バッジ・アクセント用背景 */
      --accent: #D97706;
      --bg: #F9FAFB;
      --surface: #FFFFFF;
      --text: #1F2937;
      --text-muted: #4B5563;
      --text-subtle: #6B7280;
      --border: #E5E7EB;
      --border-amber: #FCD34D;
      --success: #059669;
      --success-bg: #ECFDF5;
      --error: #DC2626;
      --error-bg: #FEF2F2;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(180, 83, 9, 0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 25px rgba(180, 83, 9, 0.12), 0 4px 6px rgba(0,0,0,0.05);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* アプリのコンテナ（スマホ最適化 1カラム） */
    #app-container {
      width: 100%;
      max-width: 640px;
      min-height: 100vh;
      background-color: var(--surface);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0,0,0,0.04);
    }

    header {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
      border-bottom: 2px solid var(--border-amber);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .app-title-area {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .header-marumochi-avatar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .app-subtitle {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--primary);
    }

    .header-nav-btn {
      background: white;
      border: 1px solid var(--border-amber);
      color: var(--primary-dark);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .header-nav-btn:hover {
      background: var(--primary-bg);
      transform: translateY(-1px);
    }

    main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    /* 飲酒の注意バナー（トップに1回だけ） */
    .alcohol-warning-banner {
      background: #FFF7ED;
      border-left: 4px solid #EA580C;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 0.82rem;
      color: #9A3412;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.45;
    }

    .alcohol-warning-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    /* まるもちキャラクター（CSS表現） */
    .marumochi-avatar {
      position: relative;
      width: 52px;
      height: 48px;
      background: #FFFFFF;
      border: 2px solid #E5E7EB;
      border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* まるもちの葉っぱ（サトウキビの若芽） */
    .marumochi-avatar::before {
      content: "";
      position: absolute;
      top: -8px;
      right: 14px;
      width: 8px;
      height: 12px;
      background: #10B981;
      border-radius: 0 100% 0 100%;
      transform: rotate(20deg);
      border: 1px solid #047857;
    }
    .marumochi-avatar::after {
      content: "";
      position: absolute;
      top: -6px;
      right: 20px;
      width: 6px;
      height: 10px;
      background: #34D399;
      border-radius: 100% 0 100% 0;
      transform: rotate(-30deg);
      border: 1px solid #059669;
    }

    .marumochi-face {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .marumochi-eye {
      position: absolute;
      width: 4px;
      height: 5px;
      background: #374151;
      border-radius: 50%;
      top: 20px;
    }
    .marumochi-eye.left { left: 16px; }
    .marumochi-eye.right { right: 16px; }

    .marumochi-cheek {
      position: absolute;
      width: 8px;
      height: 5px;
      background: rgba(244, 114, 182, 0.45);
      border-radius: 50%;
      top: 24px;
    }
    .marumochi-cheek.left { left: 10px; }
    .marumochi-cheek.right { right: 10px; }

    .marumochi-mouth {
      position: absolute;
      width: 6px;
      height: 4px;
      border-bottom: 2px solid #4B5563;
      border-radius: 0 0 50% 50%;
      top: 23px;
      left: calc(50% - 3px);
    }

    /* まるもち吹き出しコンポーネント */
    .marumochi-dialogue {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .marumochi-bubble {
      position: relative;
      background: #FFFFFF;
      border: 2px solid var(--border-amber);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      flex: 1;
      font-size: 0.95rem;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      line-height: 1.6;
    }

    .marumochi-bubble::before {
      content: "";
      position: absolute;
      left: -9px;
      top: 18px;
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-right: 9px solid var(--border-amber);
    }
    .marumochi-bubble::after {
      content: "";
      position: absolute;
      left: -6px;
      top: 19px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 8px solid #FFFFFF;
    }

    .marumochi-name-tag {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 進捗サマリーカード */
    .progress-summary-card {
      background: linear-gradient(to right, #FFFBEB, #FEF3C7);
      border: 1px solid var(--border-amber);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 24px;
    }

    .progress-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 0.95rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #E5E7EB;
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(to right, var(--primary-light), var(--primary));
      border-radius: var(--radius-full);
      transition: width 0.5s ease;
    }

    .progress-text-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* 章マップ */
    .stage-section {
      margin-bottom: 28px;
    }

    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #F3F4F6;
    }

    .stage-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stage-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: var(--radius-full);
      font-weight: 700;
    }
    .stage-badge.ready {
      background: var(--primary-surface);
      color: var(--primary-dark);
      border: 1px solid var(--border-amber);
    }
    .stage-badge.locked {
      background: #F3F4F6;
      color: var(--text-subtle);
    }

    .lesson-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lesson-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .lesson-card:hover {
      border-color: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .lesson-card.cleared {
      border-color: #A7F3D0;
      background: #F0FDF4;
    }

    .lesson-card.locked {
      opacity: 0.65;
      cursor: not-allowed;
      background: #F9FAFB;
      border-style: dashed;
    }

    .lesson-card.locked:hover {
      transform: none;
      box-shadow: var(--shadow-sm);
      border-color: var(--border);
    }

    .lesson-card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    .lesson-id-badge {
      width: 38px;
      height: 38px;
      border-radius: var(--radius-sm);
      background: var(--primary-bg);
      border: 1px solid var(--border-amber);
      color: var(--primary-dark);
      font-size: 0.82rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .lesson-card.cleared .lesson-id-badge {
      background: #D1FAE5;
      border-color: #6EE7B7;
      color: #065F46;
    }

    .lesson-info {
      flex: 1;
    }

    .lesson-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }

    .lesson-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .lesson-status-icon {
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    /* お話学習画面 */
    .lesson-container {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .lesson-header-bar {
      margin-bottom: 16px;
    }

    .lesson-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .lesson-badge-category {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-bg);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-amber);
    }

    .step-indicator-pills {
      display: flex;
      gap: 6px;
    }

    .step-pill {
      width: 22px;
      height: 6px;
      border-radius: var(--radius-full);
      background: #E5E7EB;
      transition: var(--transition);
    }

    .step-pill.active {
      background: var(--primary);
      width: 32px;
    }

    .step-pill.completed {
      background: #10B981;
    }

    .lesson-main-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }

    /* スライドカード表示 */
    .slide-card {
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .slide-page-badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-subtle);
      background: #F3F4F6;
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }

    .slide-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .slide-body {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--text);
    }

    /* スライド内図解エリア */
    .slide-figure-box {
      background: #FAF5FF;
      background: linear-gradient(135deg, #FFFDF8 0%, #FFFBEB 100%);
      border: 1.5px solid var(--border-amber);
      border-radius: var(--radius-md);
      padding: 16px;
      margin: 8px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 140px;
    }

    .slide-nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
    }

    /* ボタン共通 */
    .btn {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: none;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-sm);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
    }
    .btn-secondary:hover {
      background: #F9FAFB;
      color: var(--text);
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--primary) 0%, #D97706 100%);
      color: white;
      width: 100%;
      font-size: 1.05rem;
      padding: 14px;
    }
    .btn-accent:hover {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    }

    /* お手本の一杯（Worked Example）フェーズ */
    .example-container {
      background: #FFFFFF;
      border: 2px solid var(--border-amber);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-md);
    }

    .example-badge {
      display: inline-block;
      background: var(--primary-surface);
      color: var(--primary-dark);
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      margin-bottom: 12px;
      border: 1px solid var(--border-amber);
    }

    .scene-box {
      background: #F9FAFB;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .scene-title {
      font-size: 0.82rem;
      font-weight: 800;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .scene-desc {
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.6;
    }

    .example-answer-card {
      background: #ECFDF5;
      border: 1.5px solid #6EE7B7;
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
    }

    .example-answer-label {
      font-size: 0.82rem;
      font-weight: 800;
      color: #065F46;
      margin-bottom: 4px;
    }

    .example-answer-text {
      font-size: 1.1rem;
      font-weight: 800;
      color: #047857;
      margin-bottom: 8px;
    }

    .example-reason-text {
      font-size: 0.9rem;
      color: #065F46;
      line-height: 1.5;
    }

    /* クイズ（Quiz）フェーズ */
    .quiz-container {
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-md);
    }

    .quiz-badge {
      display: inline-block;
      background: #E0E7FF;
      color: #3730A3;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      margin-bottom: 12px;
    }

    .quiz-question {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* 選択肢ボタン群 */
    .choices-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .choice-btn {
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      text-align: left;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .choice-btn:hover {
      border-color: var(--primary-light);
      background: var(--primary-bg);
      transform: translateY(-2px);
    }

    .choice-btn-letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #F3F4F6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .choice-btn:hover .choice-btn-letter {
      background: var(--primary-surface);
      color: var(--primary-dark);
    }

    /* テキスト入力式クイズ */
    .input-quiz-area {
      margin-bottom: 20px;
    }

    .text-input-field {
      width: 100%;
      padding: 14px 16px;
      font-size: 1.05rem;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      font-family: inherit;
    }

    .text-input-field:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(180, 83, 9, 0.15);
    }

    /* 3段階ヒント */
    .hint-container {
      background: #F8FAFC;
      border: 1px dashed #CBD5E1;
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 20px;
    }

    .hint-trigger-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .hint-btn {
      background: #FFFFFF;
      border: 1px solid #CBD5E1;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
    }

    .hint-btn:hover {
      background: #F1F5F9;
      color: var(--text);
    }

    .hint-content-box {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #E2E8F0;
      font-size: 0.88rem;
      color: #334155;
      line-height: 1.55;
    }

    /* フィードバック表示 */
    .feedback-card {
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      animation: fadeIn 0.3s ease;
    }

    .feedback-card.correct {
      background: #ECFDF5;
      border: 2px solid #10B981;
    }

    .feedback-card.incorrect {
      background: #FEF2F2;
      border: 2px solid #EF4444;
    }

    .feedback-title {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feedback-card.correct .feedback-title { color: #047857; }
    .feedback-card.incorrect .feedback-title { color: #B91C1C; }

    .feedback-reason {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 16px;
    }

    /* お話完了（まとめ）フェーズ */
    .lesson-finish-card {
      background: #FFFFFF;
      border: 2px solid var(--border-amber);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      animation: fadeIn 0.4s ease;
    }

    .finish-icon {
      font-size: 3rem;
      margin-bottom: 12px;

    /* ==============================================================
       2. アプリ状態管理 & localStorage
       ============================================================== */
    const STORAGE_KEY = 'rum_marumochi_progress_v1';

    let appState = {
      clearedLessons: [],
      shownModals: []
    };

    function loadProgress() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          appState.clearedLessons = Array.isArray(parsed.clearedLessons) ? parsed.clearedLessons : [];
          appState.shownModals = Array.isArray(parsed.shownModals) ? parsed.shownModals : [];
        }
      } catch (e) {
        console.error('Failed to load progress', e);
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error('Failed to save progress', e);
      }
    }

    function markLessonCleared(lessonId) {
      if (!appState.clearedLessons.includes(lessonId)) {
        appState.clearedLessons.push(lessonId);
        saveProgress();
      }
      checkMilestoneModals();
    }

    function isLessonCleared(lessonId) {
      return appState.clearedLessons.includes(lessonId);
    }

    function confirmResetProgress() {
      if (confirm('記録をリセットしてもよろしいですか？（これまでのクリア記録が初期化されます）')) {
        appState = { clearedLessons: [], shownModals: [] };
        saveProgress();
        renderTop();
      }
    }

    /* ==============================================================
       4. お話学習画面ロジック
       ============================================================== */
    let currentLesson = null;
    let currentSlideIdx = 0;
    let lessonPhase = 'slide'; // 'slide' | 'example' | 'quiz' | 'feedback' | 'finish'
    let currentProblemIdx = 0;
    let retryQueue = []; // 間違えたクイズを保持するキュー
    let currentHintLevel = 0; // 0, 1, 2, 3
    let lastFeedbackData = null;

    function startLesson(lessonId) {
      currentLesson = LESSONS[lessonId];
      if (!currentLesson) return;

      currentSlideIdx = 0;
      lessonPhase = 'slide';
      currentProblemIdx = 0;
      retryQueue = [];
      currentHintLevel = 0;
      lastFeedbackData = null;

      renderLessonView();
    }

    function renderLessonView() {
      const mainEl = document.getElementById('main-content');
      const navSlot = document.getElementById('header-nav-slot');

      // ヘッダーに「トップへ」ボタン
      navSlot.innerHTML = `
        <button class="header-nav-btn" onclick="goHome()">
          <span>✕</span>
          <span>終了</span>
        </button>
      `;

      // フェーズに応じたステップインジケータ
      const steps = ['スライド', 'お手本の一杯', 'クイズ', '完了'];
      let activeStepIdx = 0;
      if (lessonPhase === 'slide') activeStepIdx = 0;
      else if (lessonPhase === 'example') activeStepIdx = 1;
      else if (lessonPhase === 'quiz' || lessonPhase === 'feedback') activeStepIdx = 2;
      else if (lessonPhase === 'finish') activeStepIdx = 3;

      let pillsHtml = steps.map((_, i) => {
        let cls = 'step-pill';
        if (i < activeStepIdx) cls += ' completed';
        else if (i === activeStepIdx) cls += ' active';
        return `<div class="${cls}"></div>`;
      }).join('');

      let contentHtml = '';

      if (lessonPhase === 'slide') {
        contentHtml = renderSlidePhase();
      } else if (lessonPhase === 'example') {
        contentHtml = renderExamplePhase();
      } else if (lessonPhase === 'quiz') {
        contentHtml = renderQuizPhase();
      } else if (lessonPhase === 'feedback') {
        contentHtml = renderFeedbackPhase();
      } else if (lessonPhase === 'finish') {
        contentHtml = renderFinishPhase();
      }

      mainEl.innerHTML = `
        <div class="lesson-container">
          <div class="lesson-header-bar">
            <div class="lesson-meta-row">
              <span class="lesson-badge-category">${currentLesson.number} : ${currentLesson.stageId === 'prologue' ? 'プロローグ' : '第1章'}</span>
              <div class="step-indicator-pills">${pillsHtml}</div>
            </div>
            <h2 class="lesson-main-title">${currentLesson.title}</h2>
          </div>

          ${contentHtml}
        </div>
      `;

      // 画面を開いた時・切り替わった時は自動スクロールで先頭を表示（自動フォーカスによるスクロールを抑止）
      window.scrollTo(0, 0);
    }

    /* 4-1. スライド表示フェーズ */
    function renderSlidePhase() {
      const slide = currentLesson.slides[currentSlideIdx];
      const totalSlides = currentLesson.slides.length;
      const isFirst = currentSlideIdx === 0;
      const isLast = currentSlideIdx === totalSlides - 1;

      return `
        <div class="slide-card">
          <div class="slide-header">
            <h3 class="slide-title">${slide.title}</h3>
            <span class="slide-page-badge">${currentSlideIdx + 1} / ${totalSlides}</span>
          </div>

          <div class="slide-figure-box">
            ${slide.figure}
          </div>

          <div class="slide-body">
            ${slide.body}
          </div>

          <div class="slide-nav-controls">
            ${isFirst ? '<div></div>' : `<button class="btn btn-secondary" onclick="prevSlide()">← 前へ</button>`}
            ${isLast
              ? `<button class="btn btn-primary" onclick="proceedToExample()">お手本の一杯を見る →</button>`
              : `<button class="btn btn-primary" onclick="nextSlide()">次へ →</button>`
            }
          </div>
        </div>

        <div class="marumochi-dialogue">
          <div class="marumochi-avatar">
            <div class="marumochi-face">
              <div class="marumochi-eye left"></div>
              <div class="marumochi-eye right"></div>
              <div class="marumochi-cheek left"></div>
              <div class="marumochi-cheek right"></div>
              <div class="marumochi-mouth"></div>
            </div>
          </div>
          <div class="marumochi-bubble">
            <div class="marumochi-name-tag">まるもちのナビ</div>
            ${slide.body.slice(0, 45)}… 図解と一緒にじっくり味わってね！
          </div>
        </div>
      `;
    }

    function nextSlide() {
      if (currentSlideIdx < currentLesson.slides.length - 1) {
        currentSlideIdx++;
        renderLessonView();
      }
    }

    function prevSlide() {
      if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderLessonView();
      }
    }

    function proceedToExample() {
      lessonPhase = 'example';
      renderLessonView();
    }

    /* 4-2. お手本の一杯（Worked Example）フェーズ */
    function renderExamplePhase() {
      const ex = currentLesson.example;
      return `
        <div class="example-container">
          <span class="example-badge">💡 お手本の一杯（まるもちのお手本）</span>

          </div>
          <div class="marumochi-bubble">
            <div class="marumochi-name-tag">まるもちの助言</div>
            お手本の一杯の流れ（場面 ➡ 理由つきの判断）が掴めたかな？次は場面の条件が少し変わるよ。自信を持って挑戦してみてね！
          </div>
        </div>
      `;
    }

    function startPractice() {
      lessonPhase = 'quiz';
      currentProblemIdx = 0;
      currentHintLevel = 0;
      renderLessonView();
    }

    /* 4-3. クイズ（Quiz）フェーズ */
    function renderQuizPhase() {
      // リトライキューにあればそこから、なければ通常クイズ
      const problem = currentProblemIdx < currentLesson.problems.length
        ? currentLesson.problems[currentProblemIdx]
        : retryQueue[0];

      if (!problem) {
        finishLesson();
        return;
      }

      const isRetry = currentProblemIdx >= currentLesson.problems.length;

      // 選択肢HTML
      let choicesHtml = '';
      if (problem.type === 'choice') {
        const letters = ['A', 'B', 'C', 'D'];
        choicesHtml = '<div class="choices-list">';
        problem.choices.forEach((choice, idx) => {
          choicesHtml += `
            <button class="choice-btn" onclick="submitChoice(${idx})">
              <span class="choice-btn-letter">${letters[idx]}</span>
              <span>${choice}</span>
            </button>
          `;
        });
        choicesHtml += '</div>';
      } else {
        // テキスト入力式クイズの場合
        choicesHtml = `
          <div class="input-quiz-area">
            <input type="text" id="quiz-text-input" class="text-input-field" placeholder="答えを入力してください" autocomplete="off">
            <button class="btn btn-primary" style="width:100%;" onclick="submitTextInput()">回答を確定する</button>
          </div>
        `;
      }

      // 3段階ヒントHTML
      let hintBoxHtml = '';
      if (currentLesson.hints && currentLesson.hints.length > 0) {
        let hintTexts = [];
        for (let i = 0; i < currentHintLevel; i++) {
          if (currentLesson.hints[i]) {
            hintTexts.push(`<div><strong>ヒント ${i + 1}:</strong> ${currentLesson.hints[i]}</div>`);
          }
        }

        hintBoxHtml = `
          <div class="hint-container">
            <div class="hint-trigger-row">
              <span style="font-size:0.85rem; font-weight:700; color:#475569;">💡 まるもちのヒント（3段階）</span>
              ${currentHintLevel < currentLesson.hints.length
                ? `<button class="hint-btn" onclick="openNextHint()">ヒントを見る (${currentHintLevel + 1}/3)</button>`
                : `<span style="font-size:0.8rem; color:#64748B;">すべてのヒントを開きました</span>`
              }
            </div>
            ${hintTexts.length > 0 ? `<div class="hint-content-box">${hintTexts.join('<div style="height:6px;"></div>')}</div>` : ''}
          </div>
        `;
      }

      return `
        <div class="quiz-container">
          <span class="quiz-badge">${isRetry ? '🔄 定着リトライクイズ' : '🎯 クイズ'}</span>
          
          <div class="scene-box">
            <div class="scene-title">📍 あなたの直面した場面</div>
            <div class="scene-desc">${problem.scene}</div>
            ${problem.sceneFigure ? `<div style="margin-top:10px;">${problem.sceneFigure}</div>` : ''}
          </div>

          <div class="quiz-question">${problem.question}</div>

          ${choicesHtml}
          ${hintBoxHtml}
        </div>
      `;
    }

    function openNextHint() {
      if (currentLesson.hints && currentHintLevel < currentLesson.hints.length) {
        currentHintLevel++;
        renderLessonView();
      }
    }

    function submitChoice(chosenIdx) {
      const problem = currentProblemIdx < currentLesson.problems.length
        ? currentLesson.problems[currentProblemIdx]
        : retryQueue[0];

      const isCorrect = chosenIdx === problem.answer;
      handleAnswerResult(isCorrect, problem);
    }

    function submitTextInput() {
      const inputEl = document.getElementById('quiz-text-input');
      if (!inputEl) return;
      const val = normalizeText(inputEl.value);

      const problem = currentProblemIdx < currentLesson.problems.length
        ? currentLesson.problems[currentProblemIdx]
        : retryQueue[0];

      const expected = normalizeText(problem.answer);
      const isCorrect = val === expected || (problem.altAnswers && problem.altAnswers.map(normalizeText).includes(val));

      handleAnswerResult(isCorrect, problem);
    }

    function normalizeText(str) {
      if (!str) return '';
      return str.trim()
        .toLowerCase()
        .replace(/[\s　]/g, '')
        .replace(/[ァ-ン]/g, s => String.fromCharCode(s.charCodeAt(0) - 0x60)); // カタカナをひらがなに変換して表記ゆれを許容
    }

    function handleAnswerResult(isCorrect, problem) {
      const isRetry = currentProblemIdx >= currentLesson.problems.length;

      lastFeedbackData = {
        isCorrect: isCorrect,
        feedback: problem.feedback || (isCorrect ? '大正解です！' : '惜しい！もう一度見直してみましょう。'),
        isRetry: isRetry
      };

      if (!isCorrect) {
        // 間違えた場合はリトライキューに追加（重複しないように）
        if (!retryQueue.includes(problem)) {
          retryQueue.push(problem);
        }
      } else {
        // リトライで正解した場合はキューから除去
        if (isRetry) {
          retryQueue.shift();
        }
      }

      lessonPhase = 'feedback';
      renderLessonView();
    }

    /* 4-4. 即時フィードバック画面 */
    function renderFeedbackPhase() {
      const fb = lastFeedbackData;
      return `
        <div class="feedback-card ${fb.isCorrect ? 'correct' : 'incorrect'}">
          <div class="feedback-title">
            <span>${fb.isCorrect ? '🎉 正解！' : '🤔 惜しい！'}</span>
          </div>
          <div class="feedback-reason">${fb.feedback}</div>

          ${fb.isCorrect
            ? `<button class="btn btn-primary" style="width:100%;" onclick="proceedAfterFeedback()">次へ進む →</button>`
            : `<button class="btn btn-secondary" style="width:100%;" onclick="retryProblem()">もう一度挑戦する</button>`
          }
        </div>

        <div class="marumochi-dialogue">
          <div class="marumochi-avatar">
            <div class="marumochi-face">
              <div class="marumochi-eye left"></div>
              <div class="marumochi-eye right"></div>
              <div class="marumochi-cheek left"></div>
              <div class="marumochi-cheek right"></div>
              <div class="marumochi-mouth"></div>
            </div>
          </div>
          <div class="marumochi-bubble">
            <div class="marumochi-name-tag">まるもちの一言</div>
            ${fb.isCorrect
              ? '素晴らしい判断！理由と場面がしっかり結びついているよ！'
              : '間違いは発見のチャンス！理由のポイントを確認して、もう一度解いてみよう！'
            }
          </div>
        </div>
      `;
    }

    function retryProblem() {
      lessonPhase = 'quiz';
      renderLessonView();
    }

    function proceedAfterFeedback() {
      if (currentProblemIdx < currentLesson.problems.length) {
        currentProblemIdx++;
      }

      // 通常クイズがまだあるか、リトライキューに残っているか
      if (currentProblemIdx < currentLesson.problems.length || retryQueue.length > 0) {
        lessonPhase = 'quiz';
        renderLessonView();
      } else {
        finishLesson();
      }
    }

    /* 4-5. お話完了画面 */
    function finishLesson() {
      lessonPhase = 'finish';
      markLessonCleared(currentLesson.id);
      renderLessonView();
    }

    function renderFinishPhase() {
      // 次のお話を探す
      const allIds = Object.keys(LESSONS);
      const currentIdx = allIds.indexOf(currentLesson.id);
      const nextLesson = currentIdx >= 0 && currentIdx < allIds.length - 1 ? LESSONS[allIds[currentIdx + 1]] : null;

      return `
        <div class="lesson-finish-card">
          <div class="finish-icon">🎊</div>
          <h2 class="finish-title">お話完了！</h2>
          <div style="color:#059669; font-weight:700; font-size:0.95rem;">「${currentLesson.title}」をマスターしました</div>

          <div class="finish-afternote">
            <div style="font-weight:bold; color:var(--primary-dark); margin-bottom:4px;">📝 まるもちのテイスティングメモ</div>
            ${currentLesson.afterNote}
          </div>

          <div style="display:flex; flex-direction:column; gap:10px;">
            ${nextLesson
              ? `<button class="btn btn-primary" style="width:100%;" onclick="startLesson('${nextLesson.id}')">次のお話へ進む（${nextLesson.title}） →</button>`
              : ''
            }
            <button class="btn btn-secondary" style="width:100%;" onclick="goHome()">章一覧（トップ）に戻る</button>
          </div>
        </div>
      `;
    }

    /* ==============================================================
       5. お祝いモーダル管理（章全クリ・実装全クリ）
       ============================================================== */
    function checkMilestoneModals() {
      // プロローグ全クリアチェック
      const prologueStage = STAGES.find(s => s.id === 'prologue');
      if (prologueStage) {
        const isPrologueAll = prologueStage.lessonIds.every(id => isLessonCleared(id));
        if (isPrologueAll && !appState.shownModals.includes('prologue_cleared')) {
          appState.shownModals.push('prologue_cleared');
          saveProgress();
          showCongratModal(
            '🌟 プロローグ全お話達成！',
            'おめでとうございます！ラム酒を自由に愉しむための基礎とマインドセットがバッチリ身につきました。さあ、第1章でラムの奥深い正体を解き明かしましょう！'
          );
          return;
        }
      }

      // 第1章全クリアチェック
      const stage0 = STAGES.find(s => s.id === 'stage0');
      if (stage0) {
        const isStage0All = stage0.lessonIds.every(id => isLessonCleared(id));
        if (isStage0All && !appState.shownModals.includes('stage0_cleared')) {
          appState.shownModals.push('stage0_cleared');
          saveProgress();
          showCongratModal(
            '🏆 第1章 完全制覇！',
            '素晴らしい！原料・蒸留・色・3大系統まで、ラムのラベルを読み解く知識がしっかり身につきました。これであなたも立派なラムの目利きです！'
          );
          return;
        }
      }

      // 実装済み全お話（プロローグ + 第1章 計11お話）クリアチェック
      const allImplementedIds = Object.keys(LESSONS);
      const isAllCleared = allImplementedIds.every(id => isLessonCleared(id));
      if (isAllCleared && !appState.shownModals.includes('all_implemented_cleared')) {
        appState.shownModals.push('all_implemented_cleared');
        saveProgress();
        showCongratModal(
          '👑 第1弾 全お話完全制覇！',
          'プロローグ＆第1章の全11お話をすべてクリアしました！まるもちも大感激です！第2章以降の公開をぜひ楽しみにお待ちください。'
        );
      }
    }

    function showCongratModal(title, message) {
      const slot = document.getElementById('modal-slot');
      slot.innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal-window" onclick="event.stopPropagation()">
            <div class="modal-badge-icon">🎉</div>
            <h3 class="modal-title">${title}</h3>
            <p class="modal-desc">${message}</p>
            <button class="btn btn-primary" style="width:100%;" onclick="closeModal()">ありがとう！続ける</button>
          </div>
        </div>
      `;
    }

    function closeModal() {
      const slot = document.getElementById('modal-slot');
      slot.innerHTML = '';
    }

    /* ==============================================================
       6. 初期化
       ============================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      loadProgress();
      renderTop();
    });
  </script>
</body>
</html>
