<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たる吉と愉しむラム酒さんぽ</title>
  <style>
    :root {
      --primary: #B45309;        /* アンバー（メインカラー） */
      --primary-dark: #78350F;   /* 濃い琥珀色 */
      --primary-light: #F59E0B;  /* 明るい琥珀色 */
      --primary-bg: #FFFBEB;     /* 淡いアンバー背景 */
      --primary-surface: #FEF3C7;/* バッジ・アクセント用背景 */
      --accent: #D97706;
      --bg: #F9FAFB;
      --surface: #FFFFFF;
      --text: #1F2937;
      --text-muted: #4B5563;
      --text-subtle: #6B7280;
      --border: #E5E7EB;
      --border-amber: #FCD34D;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(180, 83, 9, 0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg: 0 10px 25px rgba(180, 83, 9, 0.12), 0 4px 6px rgba(0,0,0,0.05);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* アプリのコンテナ（スマホ最適化 1カラム） */
    #app-container {
      width: 100%;
      max-width: 640px;
      min-height: 100vh;
      background-color: var(--surface);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 30px rgba(0,0,0,0.04);
    }

    header {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
      border-bottom: 2px solid var(--border-amber);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .app-title-area {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .header-marumochi-avatar {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary-dark);
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .app-subtitle {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tag-release {
      display: inline-block;
      background: #B45309;
      color: #FFF;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      letter-spacing: 0.02em;
    }

    .header-nav-btn {
      background: white;
      border: 1px solid var(--border-amber);
      color: var(--primary-dark);
      font-size: 0.88rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
    }

    .header-nav-btn:hover {
      background: var(--primary-bg);
      transform: translateY(-1px);
    }

    main {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    /* 飲酒の注意バナー（トップに1回だけ） */
    .alcohol-warning-banner {
      background: #FFF7ED;
      border-left: 4px solid #EA580C;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #9A3412;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.45;
    }

    .alcohol-warning-icon {
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .avatar-mini {
      width: 30px;
      height: 30px;
      display: inline-block;
      vertical-align: middle;
      border-radius: 24%;
      animation: none;
    }
    .avatar-large {
      width: 84px;
      height: 84px;
      border-radius: 22%;
    }

    /* たる吉吹き出しコンポーネント */
    .marumochi-dialogue {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .marumochi-bubble {
      position: relative;
      background: #FFFFFF;
      border: 2px solid var(--border-amber);
      border-radius: var(--radius-md);
      padding: 14px 18px;
      flex: 1;
      font-size: 0.98rem;
      color: var(--text);
      box-shadow: var(--shadow-sm);
      line-height: 1.6;
    }

    .marumochi-bubble::before {
      content: "";
      position: absolute;
      left: -9px;
      top: 18px;
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-right: 9px solid var(--border-amber);
    }
    .marumochi-bubble::after {
      content: "";
      position: absolute;
      left: -6px;
      top: 19px;
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 8px solid #FFFFFF;
    }

    .marumochi-name-tag {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 愉しみ具合（進捗）カード */
    .progress-summary-card {
      background: linear-gradient(to right, #FFFBEB, #FEF3C7);
      border: 1px solid var(--border-amber);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      margin-bottom: 24px;
    }

    .progress-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 1rem;
    }

    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #E5E7EB;
      border-radius: var(--radius-full);
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(to right, var(--primary-light), var(--primary));
      border-radius: var(--radius-full);
      transition: width 0.5s ease;
    }

    .progress-text-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* 目次・各章セクション */
    .chapter-section {
      margin-bottom: 28px;
    }

    .chapter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #F3F4F6;
    }

    .chapter-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chapter-badge {
      font-size: 0.78rem;
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-weight: 700;
    }
    .chapter-badge.ready {
      background: var(--primary-surface);
      color: var(--primary-dark);
      border: 1px solid var(--border-amber);
    }
    .chapter-badge.locked {
      background: #F3F4F6;
      color: var(--text-subtle);
    }

    .story-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .story-card {
      background: #FFFFFF;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .story-card:hover {
      border-color: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .story-card.cleared {
      border-color: #FCD34D;
      background: #FFFDF7;
    }

    .story-card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
    }

    /* ==============================================================
       2. アプリ状態管理 & localStorage
       ============================================================== */
    const STORAGE_KEY = 'rum_marumochi_progress_v1';

    let appState = {
      clearedStories: [],
      shownModals: []
    };

    function loadProgress() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          appState.clearedStories = Array.isArray(parsed.clearedStories) ? parsed.clearedStories : (parsed.clearedLessons || []);
          appState.shownModals = Array.isArray(parsed.shownModals) ? parsed.shownModals : [];
        }
      } catch (e) {
        console.error('Failed to load progress', e);
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error('Failed to save progress', e);
      }
    }

    function markStoryCleared(storyId) {
      if (!appState.clearedStories.includes(storyId)) {
        appState.clearedStories.push(storyId);
        saveProgress();
      }
      checkMilestoneModals();
    }

    function isStoryCleared(storyId) {
      return appState.clearedStories.includes(storyId);
    }

    function confirmResetProgress() {
      if (confirm('読んだ記録をリセットしてもよろしいですか？')) {
        appState = { clearedStories: [], shownModals: [] };
        saveProgress();
        renderTop();
      }
    }

    /* ==============================================================
       3. 画面レンダリング（トップ画面・目次）
       ============================================================== */
    function goHome() {
      renderTop();
    }

    function renderTop() {
      const mainEl = document.getElementById('main-content');
      const navSlot = document.getElementById('header-nav-slot');
      navSlot.innerHTML = '';

      const allImplementedStoryIds = Object.keys(STORIES);
      const totalImplemented = allImplementedStoryIds.length;
      const clearedCount = allImplementedStoryIds.filter(id => isStoryCleared(id)).length;
      const progressPercent = Math.round((clearedCount / totalImplemented) * 100);

      let chaptersHtml = '';

      CHAPTERS.forEach(chapter => {
        const isUpcoming = chapter.status === 'upcoming';
        const chapterStories = chapter.storyIds.map(id => STORIES[id]).filter(Boolean);
        const chapterTotal = chapterStories.length;
        const chapterCleared = chapterStories.filter(s => isStoryCleared(s.id)).length;
        const isChapterFullyCleared = chapterTotal > 0 && chapterCleared === chapterTotal;

        let storiesListHtml = '';

        if (isUpcoming) {
          storiesListHtml = `
            <div style="background:#F9FAFB; border:1px dashed #D1D5DB; border-radius:12px; padding:20px; text-align:center; color:#6B7280; font-size:0.95rem;">
              <span class="marumochi-avatar avatar-mini avatar-sleepy"></span> 近日公開予定です。お楽しみに！
            </div>
          `;
        } else {
          storiesListHtml = '<div class="story-grid">';
          chapterStories.forEach(story => {
            const cleared = isStoryCleared(story.id);
            storiesListHtml += `
              <div class="story-card ${cleared ? 'cleared' : ''}" onclick="startStory('${story.id}')">
                <div class="story-card-left">
                  <div class="story-id-badge">${cleared ? '✓' : story.number}</div>
                  <div class="story-info">
                    <div class="story-title">${story.title}</div>
                    <div class="story-desc">${story.summary}</div>
                  </div>
                </div>
                <div class="story-status-icon">${cleared ? '🥂' : '📖'}</div>
              </div>
            `;
          });
          storiesListHtml += '</div>';
        }

        chaptersHtml += `
          <div class="chapter-section">
            <div class="chapter-header">
              <div class="chapter-title">
                <span>${chapter.title}</span>
              </div>
              <span class="chapter-badge ${isUpcoming ? 'locked' : 'ready'}">
                ${isUpcoming ? '近日公開' : (isChapterFullyCleared ? '読了！' : `${chapterCleared}/${chapterTotal}`)}
              </span>
            </div>
            <div style="font-size:0.9rem; color:#4B5563; margin-bottom:14px; line-height:1.5;">${chapter.desc}</div>
            ${storiesListHtml}
          </div>
        `;
      });

      mainEl.innerHTML = `
        <!-- 飲酒の注意バナー（トップに1回だけ） -->
        <div class="alcohol-warning-banner">
          <span class="marumochi-avatar avatar-mini avatar-troubled"></span>

        <!-- たる吉の案内吹き出し -->

            カードをめくりながら、「今夜の気分ならどれ？」を一緒に愉しく選んでいきましょう！

    /* ==============================================================
       4. お話画面ロジック
       ============================================================== */
    let currentStory = null;
    let currentSlideIdx = 0;
    let storyPhase = 'slide'; // 'slide' | 'example' | 'pick' | 'finish'
    let currentPickIdx = 0;
    let selectedChoiceIdx = null;

    function startStory(storyId) {
      currentStory = STORIES[storyId];
      if (!currentStory) return;

      currentSlideIdx = 0;
      storyPhase = 'slide';
      currentPickIdx = 0;
      selectedChoiceIdx = null;

      renderStoryView();
    }

    function renderStoryView() {
      const mainEl = document.getElementById('main-content');
      const navSlot = document.getElementById('header-nav-slot');

      navSlot.innerHTML = `
        <button class="header-nav-btn" onclick="goHome()">
          <span>✕</span>
          <span>目次へ</span>
        </button>
      `;

      const steps = ['スライド', 'お手本の一杯', '気分で選ぶ', '締めのひとこと'];
      let activeStepIdx = 0;
      if (storyPhase === 'slide') activeStepIdx = 0;
      else if (storyPhase === 'example') activeStepIdx = 1;
      else if (storyPhase === 'pick') activeStepIdx = 2;
      else if (storyPhase === 'finish') activeStepIdx = 3;

      let pillsHtml = steps.map((_, i) => {
        let cls = 'step-pill';
        if (i < activeStepIdx) cls += ' completed';
        else if (i === activeStepIdx) cls += ' active';
        return `<div class="${cls}"></div>`;
      }).join('');

      let contentHtml = '';

      if (storyPhase === 'slide') {
        contentHtml = renderSlidePhase();
      } else if (storyPhase === 'example') {
        contentHtml = renderExamplePhase();
      } else if (storyPhase === 'pick') {
        contentHtml = renderPickPhase();
      } else if (storyPhase === 'finish') {
        contentHtml = renderFinishPhase();
      }

      mainEl.innerHTML = `
        <div class="story-container">
          <div class="story-header-bar">
            <div class="story-meta-row">
              <span class="story-badge-category">${currentStory.number} : ${currentStory.chapterId === 'prologue' ? 'プロローグ' : '第1章'}</span>
              <div class="step-indicator-pills">${pillsHtml}</div>
            </div>
            <h2 class="story-main-title">${currentStory.title}</h2>
          </div>

          ${contentHtml}
        </div>
      `;

      window.scrollTo(0, 0);
    }

    /* 4-1. スライドフェーズ */
    function renderSlidePhase() {
      const slide = currentStory.slides[currentSlideIdx];
      const totalSlides = currentStory.slides.length;
      const isFirst = currentSlideIdx === 0;
      const isLast = currentSlideIdx === totalSlides - 1;

      return `
        <div class="slide-card">
          <div class="slide-header">
            <h3 class="slide-title">${slide.title}</h3>
            <span class="slide-page-badge">${currentSlideIdx + 1} / ${totalSlides}</span>
          </div>

          <div class="slide-figure-box">
            ${slide.figure}
          </div>

          <div class="slide-body">
            ${slide.body}
          </div>

          <div class="slide-nav-controls">
            ${isFirst ? '<div></div>' : `<button class="btn btn-secondary" onclick="prevSlide()">← 前へ</button>`}
            ${isLast
              ? `<button class="btn btn-primary" onclick="proceedToExample()">お手本の一杯を見る →</button>`
              : `<button class="btn btn-primary" onclick="nextSlide()">次へ →</button>`
            }
          </div>
        </div>

        <div class="marumochi-dialogue">
          <div class="marumochi-avatar">
            <div class="marumochi-face">
              <div class="marumochi-eye left"></div>
              <div class="marumochi-eye right"></div>
              <div class="marumochi-cheek left"></div>
              <div class="marumochi-cheek right"></div>
              <div class="marumochi-mouth"></div>
            </div>
          </div>
          <div class="marumochi-bubble">
            <div class="marumochi-name-tag">たる吉のひとこと</div>
            ${slide.comment || "図解と一緒にじっくり味わってね！"}
          </div>
        </div>
      `;
    }

    function nextSlide() {
      if (currentSlideIdx < currentStory.slides.length - 1) {
        currentSlideIdx++;
        renderStoryView();
      }
    }

    function prevSlide() {
      if (currentSlideIdx > 0) {
        currentSlideIdx--;
        renderStoryView();
      }
    }

    function proceedToExample() {
      storyPhase = 'example';
      renderStoryView();
    }

    /* 4-2. お手本の一杯（Example）フェーズ */
    function renderExamplePhase() {
      const ex = currentStory.example;
      return `
        <div class="example-container">
          <span class="example-badge">🥃 お手本の一杯</span>
          
          <div class="scene-box">
            <div class="scene-title">📍 場面のイメージ</div>
            <div class="scene-desc">${ex.scene}</div>
            ${ex.sceneFigure ? `<div style="margin-top:12px;">${ex.sceneFigure}</div>` : ''}
          </div>

          <div class="example-choice-card">
            <div class="example-choice-label">たる吉のセレクト</div>
            <div class="example-choice-text">${ex.choice}</div>
            <div class="example-reason-text"><strong>【理由】</strong>${ex.reason}</div>
          </div>

          <button class="btn btn-accent" onclick="startPickPhase()">
            気分で選んでみる！ →
          </button>
        </div>

        <div class="marumochi-dialogue">
          <div class="marumochi-avatar avatar-sendo">
            <div class="marumochi-face">
              <div class="marumochi-eye left"></div>
              <div class="marumochi-eye right"></div>
              <div class="marumochi-cheek left"></div>
              <div class="marumochi-cheek right"></div>
              <div class="marumochi-mouth"></div>
            </div>
          </div>
          <div class="marumochi-bubble">
            <div class="marumochi-name-tag">たる吉の助言</div>
            お手本はあくまで一例だよ。次はあなたの番！好きな選択肢を直感でタップしてみてね。
          </div>
        </div>
      `;
    }

    function startPickPhase() {
      storyPhase = 'pick';
      currentPickIdx = 0;
      selectedChoiceIdx = null;
      renderStoryView();
    }

    /* 4-3. 気分で選ぶ（Pick）フェーズ */
    function renderPickPhase() {
      const pick = currentStory.picks[currentPickIdx];
      if (!pick) {
        finishStory();
        return;
      }

      const hasSelected = selectedChoiceIdx !== null;
      const selectedChoice = hasSelected ? pick.choices[selectedChoiceIdx] : null;

      let choicesHtml = '<div class="choices-list">';
      const icons = ['✨', '🌿', '🌙', '☀️'];
      pick.choices.forEach((choice, idx) => {
        const isSelected = selectedChoiceIdx === idx;
        choicesHtml += `
          <button class="pick-btn ${isSelected ? 'selected' : ''}" onclick="onSelectPickChoice(${idx})">
            <span class="pick-btn-icon">${icons[idx % icons.length]}</span>
            <span>${choice.label}</span>
          </button>
        `;
      });
      choicesHtml += '</div>';

      let responseHtml = '';
      if (hasSelected && selectedChoice) {
        responseHtml = `
          <div class="pick-response-card">
            <div class="pick-response-header">
              <span><span class="marumochi-avatar avatar-mini avatar-surprised" style="margin-right:6px;"></span>この選択の愉しみ方</span>
            </div>
            <div class="pick-response-body">
              ${selectedChoice.response}
            </div>
            <button class="btn btn-primary" style="width:100%;" onclick="proceedAfterPick()">
              ${currentPickIdx < currentStory.picks.length - 1 ? '次の場面へ進む →' : '締めのひとことへ →'}
            </button>
          </div>
        `;
      }

      return `
        <div class="pick-container">
          <span class="pick-badge">✨ 気分で選ぶ</span>
          
          <div class="scene-box">
            <div class="scene-title">📍 あなたの場面</div>
            <div class="scene-desc">${pick.scene}</div>
            ${pick.sceneFigure ? `<div style="margin-top:12px;">${pick.sceneFigure}</div>` : ''}
          </div>

          <div class="pick-question">${pick.question}</div>

          ${choicesHtml}
          ${responseHtml}
        </div>

        ${!hasSelected ? `
          <div class="marumochi-dialogue">
            <div class="marumochi-avatar avatar-rowing">
              <div class="marumochi-face">
                <div class="marumochi-eye left"></div>
                <div class="marumochi-eye right"></div>
                <div class="marumochi-cheek left"></div>
                <div class="marumochi-cheek right"></div>
                <div class="marumochi-mouth"></div>
              </div>
            </div>
            <div class="marumochi-bubble">
              <div class="marumochi-name-tag">たる吉のナビ</div>
              正解・不正解はないよ。今夜の気分に一番近いものをタップしてみてね！
            </div>
          </div>
        ` : ''}
      `;
    }

    function onSelectPickChoice(idx) {
      selectedChoiceIdx = idx;
      renderStoryView();
    }

    function proceedAfterPick() {
      if (currentPickIdx < currentStory.picks.length - 1) {
        currentPickIdx++;
        selectedChoiceIdx = null;
        renderStoryView();
      } else {
        finishStory();
      }
    }

    /* 4-4. 締めのひとこと（finish）フェーズ */
    function finishStory() {
      storyPhase = 'finish';
      markStoryCleared(currentStory.id);
      renderStoryView();
    }

    function renderFinishPhase() {
      const allIds = Object.keys(STORIES);
      const currentIdx = allIds.indexOf(currentStory.id);
      const nextStory = currentIdx >= 0 && currentIdx < allIds.length - 1 ? STORIES[allIds[currentIdx + 1]] : null;

      return `
        <div class="story-finish-card">
          <div class="marumochi-avatar avatar-large avatar-happy" style="margin:0 auto 14px;"></div>
          <h2 class="finish-title">このお話を読み終えました！</h2>
          <div style="color:#B45309; font-weight:700; font-size:1rem;">「${currentStory.title}」読了</div>

          <div class="finish-afternote">
            <div style="font-weight:800; color:var(--primary-dark); margin-bottom:6px; font-size:1.02rem;">📝 たる吉のテイスティングメモ</div>
            ${currentStory.afterNote}
          </div>

          <div style="display:flex; flex-direction:column; gap:12px;">
            ${nextStory
              ? `<button class="btn btn-primary" style="width:100%;" onclick="startStory('${nextStory.id}')">次のお話へ進む（${nextStory.title}） →</button>`
              : ''
            }
            <button class="btn btn-secondary" style="width:100%;" onclick="goHome()">目次に戻る</button>
          </div>
        </div>
      `;
    }

    /* ==============================================================
       5. お祝いモーダル管理（章全読了・全お話読了）
       ============================================================== */
    function checkMilestoneModals() {
      // プロローグ全読了チェック
      const prologueChapter = CHAPTERS.find(c => c.id === 'prologue');
      if (prologueChapter) {
        const isPrologueAll = prologueChapter.storyIds.every(id => isStoryCleared(id));
        if (isPrologueAll && !appState.shownModals.includes('prologue_cleared')) {
          appState.shownModals.push('prologue_cleared');
          saveProgress();
          showCongratModal(
            '🌟 プロローグ全お話 読了！',
            'おめでとうございます！ラム酒を自由に愉しむための基礎とマインドセットがバッチリ身につきました。さあ、第1章でラムの奥深い正体を解き明かしましょう！'
          );
          return;
        }
      }

      // 第1章全読了チェック
      const chapter1 = CHAPTERS.find(c => c.id === 'chapter1');
      if (chapter1) {
        const isChapter1All = chapter1.storyIds.every(id => isStoryCleared(id));
        if (isChapter1All && !appState.shownModals.includes('chapter1_cleared')) {
          appState.shownModals.push('chapter1_cleared');
          saveProgress();
          showCongratModal(
            '🏆 第1章 完全読了！',
            '素晴らしい！原料・蒸留・色・3大系統まで、ラムのラベルを読み解く知識がしっかり身につきました。これであなたも立派なラムの目利きです！'
          );
          return;
        }
      }

      // 公開済み全お話（プロローグ4話 + 第1章6話 = 計10話）読了チェック
      const allImplementedIds = Object.keys(STORIES);
      const isAllCleared = allImplementedIds.every(id => isStoryCleared(id));
      if (isAllCleared && !appState.shownModals.includes('all_implemented_cleared')) {
        appState.shownModals.push('all_implemented_cleared');
        saveProgress();
        showCongratModal(
          '👑 第1弾 全お話完全読了！',
          'プロローグ＆第1章の全10お話をすべて読み終えました！たる吉も大感激です！第2章以降の公開もぜひ楽しみにお待ちください。'
        );
      }
    }

    function showCongratModal(title, message) {
      const slot = document.getElementById('modal-slot');
      slot.innerHTML = `
        <div class="modal-overlay" onclick="closeModal()">
          <div class="modal-window" onclick="event.stopPropagation()">
            <div class="marumochi-avatar avatar-large avatar-happy" style="margin:0 auto 14px;"></div>
            <h3 class="modal-title">${title}</h3>
            <p class="modal-desc">${message}</p>
            <button class="btn btn-primary" style="width:100%;" onclick="closeModal()">ありがとう！続ける</button>
          </div>
        </div>
      `;
    }

    function closeModal() {
      const slot = document.getElementById('modal-slot');
      slot.innerHTML = '';
    }

    /* ==============================================================
       6. 初期化
       ============================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      loadProgress();
      renderTop();
    });
  </script>
</body>
</html>
